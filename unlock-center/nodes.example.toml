# =============================================================================
# unlock-center 节点表示例
# 用法：cp nodes.example.toml nodes.toml，把 unlock_ip / dns_upstream 改成真实公网 IP
# 每个 [[nodes]] = 一台区域解锁机（跑 unlock 镜像、单区 WARP）
#
# 字段说明：
#   id            节点唯一名，仅日志/排障用
#   region        逻辑区名：须与 domain-region.map 的 regional 区、DoH path（/us）一致
#                 可自定义，如 uk、sg、foo；中心 allow_regions 里也要有
#   unlock_ip     返回给客户端的 A 记录 IP = 客户端去连 sniproxy 的地址（公网）
#   dns_upstream  旧版/未配置控制通道时，中心「未命中域名」代查 UDP 地址，格式 IP:53。
#                 配置 CENTER_CONTROL_TOKEN 且该 id 的 unlock 已连入时，中心优先复用
#                 该条 WSS 控制连接代查；连接不可用才回退这里和 fallback_upstreams。
#   weight        同 region 多机时加权（整数，越大越容易被选中）
#   lat / lon     经纬度，供 GeoIP nearest 算「离客户端最近」；建议填准
#
# 多区并发：下面 us/jp/hk/uk 可同时存在；查 dmm→jp、查 mytv→hk、查 netflix→path 全局区
# =============================================================================

[[nodes]]
id = "us-1"
region = "us"
unlock_ip = "203.0.113.10"
dns_upstream = "203.0.113.10:53"
weight = 10
lat = 37.77
lon = -122.42

[[nodes]]
id = "jp-1"
region = "jp"
unlock_ip = "203.0.113.20"
dns_upstream = "203.0.113.20:53"
weight = 10
lat = 35.68
lon = 139.69

[[nodes]]
id = "hk-1"
region = "hk"
unlock_ip = "203.0.113.30"
dns_upstream = "203.0.113.30:53"
weight = 10
lat = 22.32
lon = 114.17

# 英区示例：部署英区 unlock 后改成真实 IP；map 里 regional uk 的域名会指到这里
[[nodes]]
id = "uk-1"
region = "uk"
unlock_ip = "203.0.113.40"
dns_upstream = "203.0.113.40:53"
weight = 10
lat = 51.51
lon = -0.13

