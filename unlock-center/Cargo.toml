[workspace]
resolver = "2"
members = [
    "crates/domain-index",
    "crates/schedule",
    "crates/unlock-center",
]
default-members = ["crates/unlock-center"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Lanlan13-14"]

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
bytes = "1"
dashmap = "5"
futures-util = "=0.3.31"
ipnet = "=2.10.1"
serde_json = "=1.0.138"
sha1 = "=0.10.6"
tokio-tungstenite = "=0.26.2"
# Keep hickory on 0.24 line for broader MSRV
hickory-proto = "=0.24.4"
hyper = { version = "1.5", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.10", features = ["tokio", "server", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
rcgen = "=0.13.2"
# reqwest 0.12 without http3/quinn explosion
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls", "blocking"] }
rustls = "=0.23.20"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1.42", features = ["full"] }
tokio-rustls = "=0.26.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
maxminddb = "0.24"
flate2 = "1"
# Force older zeroize (1.9 needs edition2024 / rustc 1.85+)
zeroize = "=1.8.1"
