# Manual, versioned GHCR release for Proxym-Easy DNS Unlock.
# The Docker build context is deliberately ONLY ./unlock.

name: publish-unlock-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, e.g. v1.0.0 or 1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: proxym-easy-unlock

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          # OCI tag-safe SemVer-like versions; accepts v1.2.3 and 1.2.3-rc.1.
          if [[ ! "$version" =~ ^v?[0-9]+(\.[0-9]+){0,2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid version: $version" >&2
            echo "Use a version such as v1.0.0, 1.2.3, or v1.2.0-rc.1." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unlock
    steps:
      - uses: actions/checkout@v4
      - name: Install SOCKS5 runtime test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dante-server
      - name: Docs/config consistency
        run: |
          set -e
          grep -q 'ALLOWED_IPS' README.md .env.example
          grep -q 'SOCKS5_ALLOWED_IPS' README.md .env.example
          grep -q 'DOT_TLS_MODE' README.md .env.example
          grep -q 'ENABLE_ACL' README.md .env.example
          grep -q 'SOCKS5_PORT' README.md .env.example docker-compose.yml
      - name: Shell syntax
        run: |
          set -e
          for f in scripts/*.sh tests/*.sh; do
            echo "check $f"
            sh -n "$f"
          done
      - name: Generate domains from checkout path
        run: |
          # No UNLOCK_ROOT: this verifies CI/local path auto-detection.
          env -u UNLOCK_ROOT sh scripts/gen-domains.sh
          test -s domains/all.txt
          wc -l domains/all.txt
      - name: Unit tests
        run: sh tests/run.sh
      - name: Dante username/password runtime
        run: sudo python3 tests/dante-runtime.py

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          # CRITICAL: never broaden this to repository root.
          context: ./unlock
          file: ./unlock/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
