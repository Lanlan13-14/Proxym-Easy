name: build-easytier-gateway

on:
  push:
    branches:
      - main
    paths:
      - 'easytier/gateway/**'
      - '.github/workflows/build-easytier-gateway.yml'
      - 'easytier/easytier-cf-debian.py'
      - 'easytier/tests/**'
      - 'easytier/README.md'
      - 'easytier/DEPLOY.md'
  pull_request:
    paths:
      - 'easytier/gateway/**'
      - '.github/workflows/build-easytier-gateway.yml'
      - 'easytier/easytier-cf-debian.py'
      - 'easytier/tests/**'
      - 'easytier/README.md'
      - 'easytier/DEPLOY.md'
  workflow_dispatch:

concurrency:
  group: easytier-gateway-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local
  GOMAXPROCS: '2'

jobs:
  test:
    name: Go tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easytier/gateway
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: easytier/gateway/go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Check pinned toolchain
        run: test "$(go env GOVERSION)" = "go${GO_VERSION}"
      - name: Unit tests including root control and supervisor
        run: |
          set -euo pipefail
          sudo env PATH="$PATH" GOTOOLCHAIN=local GOMAXPROCS=2 CGO_ENABLED=0 go test -count=1 -v ./...
      - name: Race detector including root control and supervisor
        run: sudo env PATH="$PATH" GOTOOLCHAIN=local GOMAXPROCS=2 CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Build native integration binary
        env:
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
        run: |
          set -eu
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/easytier-gateway-linux-amd64 .
          install -m 0755 dist/easytier-gateway-linux-amd64 "$RUNNER_TEMP/easytier-gateway-test"
          echo "EASYTIER_GATEWAY_BIN=$RUNNER_TEMP/easytier-gateway-test" >> "$GITHUB_ENV"
      - name: Python installer regression tests
        working-directory: .
        env:
          EASYTIER_GATEWAY_BIN: ${{ runner.temp }}/easytier-gateway-test
          PYTHONDONTWRITEBYTECODE: '1'
        run: sudo env PATH="$PATH" EASYTIER_GATEWAY_BIN="$EASYTIER_GATEWAY_BIN" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s easytier/tests -v
      - name: Download pinned official EasyTier integration binaries
        working-directory: .
        run: |
          archive=/tmp/easytier-linux-x86_64-v2.6.4.zip
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 180 \
            https://github.com/EasyTier/EasyTier/releases/download/v2.6.4/easytier-linux-x86_64-v2.6.4.zip \
            -o "$archive"
          echo '61b659eaedba658fa66fe47d17e1426cdd77e5d02fa15fed447bb4357c09dfd6  '"$archive" | sha256sum -c -
          unzip -q "$archive" -d /tmp/easytier-official
      - name: Real Go gateway and official core integration
        working-directory: .
        env:
          EASYTIER_GATEWAY_BIN: ${{ runner.temp }}/easytier-gateway-test
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          sudo env PATH="$PATH" EASYTIER_GATEWAY_BIN="$EASYTIER_GATEWAY_BIN" PYTHONDONTWRITEBYTECODE=1 \
            python3 easytier/tests/check_go_gateway_runtime.py \
              --gateway "$EASYTIER_GATEWAY_BIN" \
              --core /tmp/easytier-official/easytier-linux-x86_64/easytier-core \
              --cli /tmp/easytier-official/easytier-linux-x86_64/easytier-cli
  build:
    name: Cross-compile ${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easytier/gateway
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            suffix: linux-amd64
          - goarch: arm64
            suffix: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: easytier/gateway/go.mod
      - name: Build static gateway
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o "dist/easytier-gateway-${{ matrix.suffix }}" ./
          chmod 0755 "dist/easytier-gateway-${{ matrix.suffix }}"
          binary="easytier-gateway-${{ matrix.suffix }}"
          go version -m "dist/$binary"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          readelf -lW "dist/$binary" > /tmp/program-header.txt
          if rg -q '^\s+INTERP\s' /tmp/program-header.txt; then exit 1; fi
          if test '${{ matrix.goarch }}' = amd64; then "dist/$binary" --version; fi
          (cd dist && sha256sum "$binary" > "$binary.sha256")
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-gateway-${{ matrix.suffix }}
          path: easytier/gateway/dist/
          if-no-files-found: error
          retention-days: 14

  stage-binaries:
    name: Stage verified binaries in repository
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: easytier-gateway-stage-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Download both architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: easytier-gateway-linux-*
          path: staged
          merge-multiple: true
      - name: Verify artifacts and commit beside installer
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test -f staged/easytier-gateway-linux-amd64.sha256
          test -f staged/easytier-gateway-linux-arm64.sha256
          (cd staged && sha256sum -c easytier-gateway-linux-amd64.sha256 && sha256sum -c easytier-gateway-linux-arm64.sha256)
          for arch in amd64 arm64; do
            file="staged/easytier-gateway-linux-$arch"
            test -x "$file"
            readelf -h "$file" > /tmp/file-header.txt
            rg -q 'Class:.*ELF64' /tmp/file-header.txt
            if readelf -lW "$file" | rg -q '^\s+INTERP\s'; then
              echo "Dynamic gateway binary rejected for $arch" >&2
              exit 1
            fi
          done
          for arch in amd64 arm64; do
            install -m 0755 "staged/easytier-gateway-linux-$arch" "easytier/easytier-gateway-linux-$arch"
            cp "staged/easytier-gateway-linux-$arch.sha256" "easytier/easytier-gateway-linux-$arch.sha256"
          done
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('easytier')
          assets=[]
          for name in ('easytier-gateway-linux-amd64','easytier-gateway-linux-arm64'):
              f=p/name
              assets.append(dict(name=name,size=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest()))
          meta=dict(format='easytier-gateway-build-v1',commit=os.environ['SOURCE_SHA'],go=os.environ['GO_VERSION'],cgo=False,run=os.environ['RUN_URL'],assets=assets)
          (p/'easytier-gateway-build.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
          git add easytier/easytier-gateway-linux-* easytier/easytier-gateway-build.json
          if git diff --cached --quiet; then echo 'Verified binary outputs already current'; exit 0; fi
          git fetch origin main --quiet
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo 'Source commit is no longer the exact main tip; refusing stale binary update.' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "build(easytier): stage Go gateway ${SOURCE_SHA:0:12} [skip ci]"
          git push origin HEAD:main
