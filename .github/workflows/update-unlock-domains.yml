# Daily rebuild of unlock/domains/all.txt from MetaCubeX geosite lists.
# Publishes a stable raw URL consumed by running containers at 04:00:
#   https://raw.githubusercontent.com/Lanlan13-14/Proxym-Easy/main/unlock/domains/all.txt
name: update-unlock-domains

on:
  schedule:
    # 19:00 UTC = 03:00 Asia/Shanghai
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Commit even when the domain list is unchanged"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-unlock-domains
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proxym-Easy
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout MetaCubeX geosite (meta branch)
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/meta-rules-dat
          ref: meta
          sparse-checkout: |
            geo/geosite
          sparse-checkout-cone-mode: true
          path: meta-rules-dat

      - name: Build merged domain list
        working-directory: unlock
        env:
          GEOSITE_DIR: ${{ github.workspace }}/meta-rules-dat/geo/geosite
          # Rules Domain YAML fetched from GitHub raw (Lanlan13-14/Rules).
          MIN_DOMAIN_COUNT: "800"
        run: |
          set -euo pipefail
          sh scripts/build-geosite-domains.sh
          test -s domains/all.txt
          count="$(wc -l < domains/all.txt | tr -d ' ')"
          echo "domains=$count" >> "$GITHUB_STEP_SUMMARY"
          echo "Merged domain count: $count"
          # Safety: never publish Google/YouTube unlock targets.
          if grep -qiE '(^|\.)(google|googleapis|gstatic|youtube|ytimg|appspot|app-measurement)(\.|$)' domains/all.txt; then
            echo "ERROR: google/youtube domains leaked into all.txt" >&2
            exit 1
          fi
          for must in netflix.com disneyplus.com bamgrid.com mytvsuper.com mewatch.sg friday.tw itv.com tvbanywhere.com; do
            grep -qx "$must" domains/all.txt || {
              echo "ERROR: missing required domain $must" >&2
              exit 1
            }
          done
          # Dedup sanity: all.txt must already be unique.
          uniq_count="$(sort -u domains/all.txt | wc -l | tr -d ' ')"
          [ "$count" = "$uniq_count" ] || {
            echo "ERROR: all.txt has duplicates ($count vs $uniq_count unique)" >&2
            exit 1
          }

      - name: Build unlock-center classified domain map
        working-directory: unlock-center
        env:
          MIN_ENTRIES: "100"
        run: |
          set -euo pipefail
          sh scripts/build-domain-map.sh
          test -s domains/domain-region.map
          test -s domains/global.txt
          test -s domains/regional.txt
          # AI may be small but file must exist
          test -f domains/ai.txt
          echo "center_map=$(grep -cvE '^\s*(#|$)' domains/domain-region.map)" >> "$GITHUB_STEP_SUMMARY"
          # required classifications
          grep -E $'^netflix\.com\tglobal\t' domains/domain-region.map
          grep -E $'^dmm\.co\.jp\tregional\tjp$' domains/domain-region.map
          grep -E $'^openai\.com\tai\t' domains/domain-region.map
          # China Media → global; bilibili family forced regional hk
          grep -E $'^youku\.com\tglobal\t' domains/domain-region.map
          grep -E $'^iqiyi\.com\tglobal\t' domains/domain-region.map
          grep -E $'^bilibili\.com\tregional\thk$' domains/domain-region.map
          # SEA media folded into sg (no separate sea region)
          grep -E $'^mewatch\.sg\tregional\tsg$' domains/domain-region.map
          grep -E $'^hbogoasia\.com\tregional\tsg$' domains/domain-region.map
          if awk -F'\t' 'NF>=3 && $1!~/^#/ && $2=="regional" && ($3=="cn" || $3=="sea") { found=1; print; } END { exit found?0:1 }' domains/domain-region.map; then
            echo "ERROR: residual cn/sea regional rows in domain-region.map" >&2
            exit 1
          fi
          if grep -qiE $'\t(google|youtube)' domains/domain-region.map; then
            echo "ERROR: google/youtube leaked into domain-region.map" >&2
            exit 1
          fi

      - name: Install control-channel test dependency
        run: python3 -m pip install --user 'websockets>=14,<17'

      - name: Unit tests with new list
        working-directory: unlock
        env:
          DOMAIN_SOURCE: keep
        run: |
          set -euo pipefail
          sh tests/run.sh
          # Explicit guard: control-agent unit path needs websockets (see tests/run.sh)
          CONTROL_CENTER_URL="wss://dns.example.com/unlock-control/v1/connect" \
            CONTROL_TOKEN=test CONTROL_NODE_ID=jp-1 \
            UNLOCK_ROOT="$PWD" sh scripts/control-agent.sh env
          python3 -c 'import websockets'
          echo "control-agent websockets OK"

      - name: unlock-center cargo test
        working-directory: unlock-center
        run: |
          set -euo pipefail
          rustc --version
          cargo test --workspace

      - name: Commit and push if changed
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unlock/domains/all.txt unlock/domains/SOURCES.md unlock/domains/geosite-sources.txt 2>/dev/null || true
          git add unlock/domains/all.txt
          git add unlock-center/domains/domain-region.map \
                  unlock-center/domains/global.txt \
                  unlock-center/domains/regional.txt \
                  unlock-center/domains/ai.txt \
                  unlock-center/domains/SOURCES.md 2>/dev/null || true
          if git diff --cached --quiet; then
            if [ "$FORCE" = "true" ]; then
              echo "No domain changes; force requested but nothing to commit."
            else
              echo "No domain changes."
            fi
            exit 0
          fi
          count="$(wc -l < unlock/domains/all.txt | tr -d ' ')"
          cmap="$(grep -cvE '^\s*(#|$)' unlock-center/domains/domain-region.map | tr -d ' ')"
          git commit -m "chore(unlock): refresh domain lists (all=${count}, center-map=${cmap})"
          git push origin HEAD:main
