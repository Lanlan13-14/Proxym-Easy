# Manual, versioned GHCR release for unlock-center (DNS control plane).
# Build context is ONLY ./unlock-center.
#
# Speed knobs:
# - test job: Swatinem/rust-cache (shared key with locked deps)
# - publish: native amd64 + arm64 runners (no QEMU), then merge manifest
# - Dockerfile: cargo registry/target BuildKit caches + rustls/ring
name: publish-unlock-center-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, e.g. v1.0.10"
        required: true
        default: "v1.0.0"
        type: string
      platforms:
        description: "linux/amd64,linux/arm64 | linux/amd64 | linux/arm64"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: proxym-easy-unlock-center
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      want_amd64: ${{ steps.plats.outputs.amd64 }}
      want_arm64: ${{ steps.plats.outputs.arm64 }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if [[ ! "$version" =~ ^v?[0-9]+(\.[0-9]+){0,2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Parse platforms
        id: plats
        shell: bash
        run: |
          set -euo pipefail
          p='${{ inputs.platforms }}'
          echo "amd64=false" >> "$GITHUB_OUTPUT"
          echo "arm64=false" >> "$GITHUB_OUTPUT"
          case ",$p," in
            *,linux/amd64,*) echo "amd64=true" >> "$GITHUB_OUTPUT" ;;
          esac
          case ",$p," in
            *,linux/arm64,*) echo "arm64=true" >> "$GITHUB_OUTPUT" ;;
          esac
          if [[ "$p" != *linux/amd64* && "$p" != *linux/arm64* ]]; then
            echo "platforms must include linux/amd64 and/or linux/arm64" >&2
            exit 1
          fi

  test:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unlock-center
    steps:
      - uses: actions/checkout@v4
      - name: Install control-channel test dependency
        run: python3 -m pip install --user 'websockets>=14,<17'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: unlock-center -> target
          shared-key: unlock-center-ci
          cache-on-failure: true
      - name: Shell and control-agent test syntax
        run: |
          set -e
          for f in scripts/*.sh tests/*.sh; do sh -n "$f"; done
          python3 -m py_compile tests/control-e2e.py
      - name: Build domain map
        run: |
          set -euo pipefail
          sh scripts/build-domain-map.sh
          test -s domains/domain-region.map
      # Release profile only (no separate debug build). `cargo test` does not
      # install the final bin at target/release/unlock-center; link it after.
      - name: Cargo test (release)
        run: cargo test --workspace --release --locked
      - name: Cargo release binary
        run: cargo build -p unlock-center --release --locked
      - name: Control channel tests
        run: |
          set -euo pipefail
          test -x "$PWD/target/release/unlock-center"
          CENTER_BINARY="$PWD/target/release/unlock-center" sh tests/run.sh
      - name: Docs consistency
        run: |
          set -e
          grep -q 'doh_base_path' config.example.toml
          grep -q 'geoip' config.example.toml
          grep -q 'domain-region.map' README.md
          grep -q 'CENTER_ALLOWED_IPS' README.md .env.example
          grep -q 'CENTER_CONTROL_TOKEN' README.md .env.example
          test -f scripts/cert-manager.sh
          test -f tests/cert-manager.test.sh
          test -f scripts/geoip-updater.sh
          test -f scripts/update-allowed-ips.sh
          test -f Dockerfile

  # Native arch builds — no QEMU (QEMU arm64 was ~40m of the old pipeline).
  build-amd64:
    needs: [prepare, test]
    if: needs.prepare.outputs.want_amd64 == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR repo path must be lowercase; repository_owner may be mixed case.
      - name: Image name
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
      - name: Build and push amd64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./unlock-center
          file: ./unlock-center/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.ref }}:${{ needs.prepare.outputs.version }}-amd64
          cache-from: type=gha,scope=unlock-center-amd64
          cache-to: type=gha,mode=max,scope=unlock-center-amd64

  build-arm64:
    needs: [prepare, test]
    if: needs.prepare.outputs.want_arm64 == 'true'
    # GitHub-hosted ARM runner (native). Falls back only if org enables it.
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
      - name: Build and push arm64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./unlock-center
          file: ./unlock-center/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.ref }}:${{ needs.prepare.outputs.version }}-arm64
          cache-from: type=gha,scope=unlock-center-arm64
          cache-to: type=gha,mode=max,scope=unlock-center-arm64

  publish:
    needs: [prepare, test, build-amd64, build-arm64]
    # Always run when test ok; individual arch jobs may be skipped.
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.build-amd64.result == 'success' || needs.build-amd64.result == 'skipped') &&
      (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped') &&
      (needs.build-amd64.result == 'success' || needs.build-arm64.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          NAME='${{ env.IMAGE_NAME }}'
          VER='${{ needs.prepare.outputs.version }}'
          IMG="ghcr.io/${OWNER}/${NAME}"
          # imagetools create takes SOURCE refs as positional args (no --amend).
          sources=()
          if [[ '${{ needs.build-amd64.result }}' == 'success' ]]; then
            sources+=("${IMG}:${VER}-amd64")
          fi
          if [[ '${{ needs.build-arm64.result }}' == 'success' ]]; then
            sources+=("${IMG}:${VER}-arm64")
          fi
          if [[ ${#sources[@]} -eq 0 ]]; then
            echo "no arch images to publish" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "${IMG}:${VER}" \
            -t "${IMG}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMG}:${VER}"
