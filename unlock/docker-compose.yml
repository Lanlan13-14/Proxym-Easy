# DNS unlock with mandatory Cloudflare Zero Trust WARP egress.
# Build context is this unlock/ directory only.
services:
  unlock:
    # 默认拉 GHCR；本地改镜像可: docker compose build
    image: ghcr.io/lanlan13-14/proxym-easy-unlock:${UNLOCK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxym-unlock
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UNLOCK_IP: ${UNLOCK_IP:-}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      ENABLE_ACL: ${ENABLE_ACL:-1}
      # Optional outbound control channel to unlock-center's existing DoH port.
      # Empty CONTROL_CENTER_URL retains legacy independent ACL/DNS behavior.
      CONTROL_CENTER_URL: ${CONTROL_CENTER_URL:-}
      CONTROL_TOKEN: ${CONTROL_TOKEN:-}
      CONTROL_NODE_ID: ${CONTROL_NODE_ID:-}
      CONTROL_RECONNECT_SECS: ${CONTROL_RECONNECT_SECS:-5}
      CONTROL_QUERY_TIMEOUT_SECS: ${CONTROL_QUERY_TIMEOUT_SECS:-0.8}
      DNS_UDP_PORT: ${DNS_UDP_PORT:-53}
      # DNS / DoT / DoH are independent. Enable any combination (at least one).
      # Plain DNS (ENABLE_DNS=1) needs no DOT_DOMAIN / LE cert.
      # 443 stays reserved for sniproxy SNI unlock — never assign DOH_PORT=443.
      ENABLE_DNS: ${ENABLE_DNS:-0}
      ENABLE_DOT: ${ENABLE_DOT:-1}
      DOT_PORT: ${DOT_PORT:-853}
      ENABLE_DOH: ${ENABLE_DOH:-1}
      DOH_PORT: ${DOH_PORT:-4430}
      DOT_DOMAIN: ${DOT_DOMAIN:-}
      DOT_TLS_MODE: ${DOT_TLS_MODE:-letsencrypt}
      LE_EMAIL: ${LE_EMAIL:-}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      RENEW_CHECK_HOURS: ${RENEW_CHECK_HOURS:-12}
      RENEW_BEFORE_DAYS: ${RENEW_BEFORE_DAYS:-30}
      UPSTREAM_DNS: ${UPSTREAM_DNS:-1.1.1.1,1.0.0.1,8.8.8.8}
      FORCE_AAAA_SOA: ${FORCE_AAAA_SOA:-yes}
      PLATFORMS: ${PLATFORMS:-all}
      REGIONS: ${REGIONS:-}
      # Mandatory Cloudflare Zero Trust Service Token enrollment.
      WARP_ORGANIZATION: ${WARP_ORGANIZATION:-}
      WARP_CLIENT_ID: ${WARP_CLIENT_ID:-}
      WARP_CLIENT_SECRET: ${WARP_CLIENT_SECRET:-}
      WARP_REGISTER_TIMEOUT: ${WARP_REGISTER_TIMEOUT:-240}
      WARP_CONNECT_TIMEOUT: ${WARP_CONNECT_TIMEOUT:-120}
      ZT_RESTART_HOURS: ${ZT_RESTART_HOURS:-12}
      # Optional SOCKS5; uses independent IP ACL and username/password.
      ENABLE_SOCKS5: ${ENABLE_SOCKS5:-0}
      SOCKS5_PORT: ${SOCKS5_PORT:-1080}
      SOCKS5_USERNAME: ${SOCKS5_USERNAME:-}
      SOCKS5_PASSWORD: ${SOCKS5_PASSWORD:-}
      SOCKS5_ALLOWED_IPS: ${SOCKS5_ALLOWED_IPS:-}
    ports:
      # Plain DNS is public only when ENABLE_DNS=1 (binds 0.0.0.0). When off,
      # SmartDNS listens on 127.0.0.1 so host mappings to DNS_UDP_PORT refuse.
      - "${DNS_UDP_PORT:-53}:${DNS_UDP_PORT:-53}/udp"
      - "${DNS_UDP_PORT:-53}:${DNS_UDP_PORT:-53}/tcp"
      # DoT / DoH ports are always mapped; listeners start only when enabled.
      - "${DOT_PORT:-853}:${DOT_PORT:-853}/tcp"
      - "${DOH_PORT:-4430}:${DOH_PORT:-4430}/tcp"
      - "80:80/tcp"
      - "443:443/tcp"
      # SOCKS5 TCP port is mapped by this single Compose file. unlock-socks5d
      # listens only when ENABLE_SOCKS5=1; otherwise no SOCKS service is available.
      - "${SOCKS5_PORT:-1080}:${SOCKS5_PORT:-1080}/tcp"
    volumes:
      - unlock-data:/etc/unlock
      - warp-data:/var/lib/cloudflare-warp
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - AUDIT_WRITE
      - SYS_PTRACE
    device_cgroup_rules:
      - "c 10:200 rwm"
    sysctls:
      - net.ipv4.ip_forward=0
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  unlock-data:
  warp-data:
