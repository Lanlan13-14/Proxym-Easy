# Reference copy of the repository-root manual publish workflow.
# In Proxym-Easy, GitHub executes .github/workflows/build-unlock-image.yml.
# Its build context is ALWAYS ./unlock, never the repository root.

name: publish-unlock-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, e.g. v1.0.0 or 1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: proxym-easy-unlock

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if [[ ! "$version" =~ ^v?[0-9]+(\.[0-9]+){0,2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unlock
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          set -e
          for f in scripts/*.sh tests/*.sh; do sh -n "$f"; done
      - name: Generate domains from checkout path
        run: |
          env -u UNLOCK_ROOT sh scripts/gen-domains.sh
          test -s domains/all.txt
      - name: Unit tests
        run: sh tests/run.sh

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./unlock
          file: ./unlock/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
