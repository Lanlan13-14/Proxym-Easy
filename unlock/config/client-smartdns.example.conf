# Example: 被解锁机 SmartDNS — 仅流媒体走解锁机 DoT/DoH/DNS
# 参考 lthero-big/Smartdns_sniproxy_installer 的 nameserver 分流模型

server-name client.local
bind 127.0.0.1:53
cache-size 32768
prefetch-domain yes

# 默认上游
server 1.1.1.1
server 8.8.8.8

# 解锁机分组（DoT 或 DoH 二选一即可；若仅内网可用明文 53）
# 把 203.0.113.10、端口 和 dot.example.com 换成你的实际值。
# tls-host-verify 会验证 Let’s Encrypt DNS-01 证书和 SNI。
server-tls 203.0.113.10:853 -group unlock -exclude-default-group -host-name dot.example.com -tls-host-verify dot.example.com
# DoH（路径固定 /dns-query；端口默认 4430，不要用 443——443 是 sniproxy）
# server-https https://203.0.113.10:4430/dns-query -group unlock -exclude-default-group -host-name dot.example.com -tls-host-verify dot.example.com
# server 203.0.113.10 -group unlock -exclude-default-group

# 示例：Netflix 走解锁组
nameserver /netflix.com/unlock
nameserver /netflix.net/unlock
nameserver /nflximg.com/unlock
nameserver /nflximg.net/unlock
nameserver /nflxvideo.net/unlock
nameserver /nflxext.com/unlock
nameserver /nflxso.net/unlock
